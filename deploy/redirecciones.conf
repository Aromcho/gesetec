# Redirecciones 301 de las URLs viejas (web hecha en Canva) a la estructura nueva.
# La web de Canva era una sola página; estas son las rutas que pueden haber quedado
# indexadas o compartidas. Para sumar una: location = /vieja { return 301 /nueva; }

location = /index.html        { return 301 /; }
location = /home              { return 301 /; }
location = /inicio            { return 301 /; }
location = /nosotros          { return 301 /; }
location = /servicios         { return 301 /#servicios; }
location = /contacto          { return 301 /#contacto; }
location = /peisa             { return 301 /service-oficial-peisa; }
location = /service-peisa     { return 301 /service-oficial-peisa; }
location = /servicio-tecnico  { return 301 /servicios/reparacion; }
location = /mantenimiento     { return 301 /servicios/mantenimiento; }
location = /instalacion       { return 301 /servicios/instalacion; }
location = /piscinas          { return 301 /servicios/climatizacion-de-piscinas; }

# Recursos internos de Canva que ya no existen (imágenes y videos del sitio viejo)
location ^~ /_assets/         { return 301 /; }
