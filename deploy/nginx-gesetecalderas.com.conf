# ─────────────────────────────────────────────────────────────────────────────
# gesetecalderas.com — sitio estático (Next.js export). Nginx sirve out/ directo,
# sin proceso de Node. Archivo: /etc/nginx/sites-available/gesetecalderas.com
#
# Instalación (ver README.md → "Deploy en el VPS"):
#   sudo ln -s /etc/nginx/sites-available/gesetecalderas.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gesetecalderas.com -d www.gesetecalderas.com
# Certbot agrega solo las líneas ssl_certificate/ssl_certificate_key de abajo.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS (sin www)
server {
    listen 80;
    listen [::]:80;
    server_name gesetecalderas.com www.gesetecalderas.com;

    # Validación de Certbot
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://gesetecalderas.com$request_uri; }
}

# www → sin www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gesetecalderas.com;

    # ssl_certificate     /etc/letsencrypt/live/gesetecalderas.com/fullchain.pem;  # lo completa Certbot
    # ssl_certificate_key /etc/letsencrypt/live/gesetecalderas.com/privkey.pem;    # lo completa Certbot

    return 301 https://gesetecalderas.com$request_uri;
}

# Sitio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gesetecalderas.com;

    # ssl_certificate     /etc/letsencrypt/live/gesetecalderas.com/fullchain.pem;  # lo completa Certbot
    # ssl_certificate_key /etc/letsencrypt/live/gesetecalderas.com/privkey.pem;    # lo completa Certbot

    root /var/www/gesetec/out;
    index index.html;
    charset utf-8;

    # Seguridad básica
    include /var/www/gesetec/deploy/encabezados.conf;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml text/x-component;

    # Redirecciones 301 de la web vieja (Canva) a la estructura nueva
    include /var/www/gesetec/deploy/redirecciones.conf;

    # Assets con hash de Next.js: caché de 1 año, inmutable
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /var/www/gesetec/deploy/encabezados.conf;
        try_files $uri =404;
    }

    # Imágenes, fuentes y logos: caché larga (30 días)
    location ~* \.(?:webp|avif|jpg|jpeg|png|gif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        include /var/www/gesetec/deploy/encabezados.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        include /var/www/gesetec/deploy/encabezados.conf;
    }

    # Páginas: URLs limpias (/service-oficial-peisa → service-oficial-peisa.html), siempre frescas
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /var/www/gesetec/deploy/encabezados.conf;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Barra final → sin barra (una sola URL por página para Google)
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;
    location = /404.html { internal; }
}
